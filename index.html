 document.querySelectorAll('[data-step]').forEach(el=>{el.classList.toggle('active',el.dataset.step===state.step);if(el.dataset.step===state.step)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});
 const complete=state.step==='collect'&&state.collected.length===3;
 const titles={explore:['一起逛水果铺','点一点水果，听听它的名字。'],quiz:['听一听，找到它','先听声音，再点你找到的水果。'],collect:[complete?'水果装好啦！':'帮水果装进篮子','听一听，点选水果，装满三个小位置。'],sentence:['一个苹果，两个苹果','点一点数量，听听句子有什么变化。']};
 $('heading').textContent=titles[state.step][0];$('subtitle').textContent=titles[state.step][1];
 $('stage').className='stage '+(state.step==='quiz'?'quiz':state.step==='collect'?'quiz collect'+(complete?' complete':''):state.step==='sentence'?'sentence':'');
 const keys=state.step==='explore'?getList():state.step==='sentence'?Array(state.quantity).fill('apple'):state.choices;
 const rowClass=keys.length===5?'five':keys.length===3?'three':'two';
 let html=`<div class="stage-note"><span></span>${state.step==='explore'?'今天的水果朋友':state.step==='sentence'?'看一看 · 说一说':complete?'谢谢你，小小帮手！':'小耳朵，仔细听'}<span></span></div>`;
 html+=`<div class="fruit-row ${rowClass}">${keys.map(fruitButton).join('')}</div>`;
 if(state.step==='sentence')html+=`<p class="sentence-line">${state.quantity===1?'There’s <em>an apple.</em>':'There are <em>two apples.</em>'}</p><div class="quantity-control" role="group" aria-label="苹果数量"><button data-qty="1" class="${state.quantity===1?'active':''}" aria-pressed="${state.quantity===1}">一个苹果</button><button data-qty="2" class="${state.quantity===2?'active':''}" aria-pressed="${state.quantity===2}">两个苹果</button></div>`;
 if(state.step==='collect')html+=`<div class="basket-wrap" aria-label="已收集${state.collected.length}个水果">${icon('basket').replace('<svg','<svg class="basket-icon"')}<div class="basket-slots">${[0,1,2].map(i=>`<span class="basket-slot ${state.collected[i]?'filled':''}">${state.collected[i]?fruitSvg(state.collected[i]):''}</span>`).join('')}</div></div>`;
 html+='<div class="play-footer">';
 if(complete)html+=`${state.group!=='all'?`<button class="pill-button" id="nextGroup">${icon('next')}${state.group==='first'?'看看新水果':'五个一起玩'}</button>`:''}<button class="pill-button" id="restart">${icon('restart')}再玩一次</button>`;
 else if(state.answered&&(state.step==='quiz'||state.step==='collect'))html+=`<button class="pill-button" id="nextRound">${icon('next')}${state.step==='collect'?'接着装水果':'再找一个'}</button>`;
 else html+=`<button class="pill-button" id="listen">${icon('speaker')}再听一次</button>`;
 html+=`</div><p class="feedback ${state.feedbackKind}" aria-live="polite">${state.feedback}</p>`;
 if(state.feedbackKind==='success')html+=stars();
 $('stageContent').innerHTML=html;
 $('groupSelect').value=state.group;
 const key=activeFruit();$('currentCard').innerHTML=`<div class="mini-fruit">${fruitSvg(key)}</div><div><div class="current-word">${key}</div><div class="current-cn">${fruitData[key].cn}${state.step==='quiz'||state.step==='collect'?' · 本题目标':''}</div></div>`;
 const words=getList();$('goal').textContent=state.step==='sentence'?'听懂一个与多个，模仿 There’s / There are':state.step==='explore'?'认识 '+words.join('、'):state.step==='quiz'?'听声音，找出对应水果':complete?'已装好三个水果，鼓励孩子再说一说':'听音辨认，帮助水果装篮';
 $('demo').innerHTML=icon('play')+(state.step==='sentence'?'播放句子':'播放示范');$('hint').innerHTML=icon('bulb')+'给点提示';$('praise').innerHTML=icon('star')+'鼓励一下';$('teacherTitle').innerHTML=icon('leaf')+'教师小助手';$('prev').innerHTML=icon('prev');$('next').innerHTML=icon('next');
 $('counter').textContent=state.step==='explore'?`${state.index+1} / ${words.length}`:state.step==='collect'?`${state.collected.length} / 3`:state.step==='sentence'?`${state.quantity} / 2`:'听音 · 点选';
 $('prev').disabled=state.step==='explore'?state.index===0:state.step==='sentence'?state.quantity===1:true;$('next').disabled=state.step==='explore'?state.index===words.length-1:state.step==='sentence'?state.quantity===2:true;
 $('sentence').textContent=state.step==='sentence'?'返回词汇 · 看一看':'句型小练习 · 一个与多个';$('hint').disabled=complete;$('demo').disabled=complete;
 $('teacherHelp').textContent=state.step==='sentence'?'先听，再指认或模仿。口语由教师观察，不自动评分。':state.step==='explore'?'点击水果或播放示范，再留一点时间让孩子跟读。':'需要帮助时给点提示。孩子答对后，主动进入下一题。';
 $('footnote').innerHTML=icon('speaker')+(state.step==='explore'?'声音可以重复听，跟着说一说就很好。':state.step==='sentence'?'看见数量变化，听见句子变化。':'可以再听一次，慢慢找也没关系。');
 $('announcer').textContent=state.feedback;
 syncVoice();
}
function listen(){if(state.step==='sentence')return speak(state.quantity===1?'one':'two','apple');return speak(activeFruit(),state.step==='explore'?activeFruit():null);}
function selectFruit(key){
 if(state.step==='sentence'){listen();return;}
 if(state.step==='explore'){if(voice.active&&voice.key===key&&!voice.paused)return;stopAudio();state.index=getList().indexOf(key);state.feedback='';render();speak(key,key);return;}
 if(state.answered)return;
 if(state.wrong===key&&voice.active)return;
 stopAudio();state.wrong=null;
 if(key===state.target){state.answered=true;if(state.step==='collect')state.collected.push(key);state.feedback=state.step==='collect'&&state.collected.length===3?'装好啦！Great job!':state.hinted?'找到了！下次也试着自己听一听。':'找到了！做得真好。';state.feedbackKind='success';render();speak('great');}
 else{state.wrong=key;state.feedback='没关系，再听一次，慢慢找。';state.feedbackKind='retry';render();speak('retry');}
}
$('stageContent').addEventListener('click',event=>{const fruit=event.target.closest('[data-fruit]');if(fruit){selectFruit(fruit.dataset.fruit);return;}if(event.target.closest('#listen'))listen();if(event.target.closest('#restart')){resetActivity('collect');listen();}if(event.target.closest('#nextGroup')){state.group=state.group==='first'?'second':'all';resetActivity('explore');}if(event.target.closest('#nextRound')){stopAudio();state.epoch++;newRound();render();listen();}const qty=event.target.closest('[data-qty]');if(qty){stopAudio();state.quantity=Number(qty.dataset.qty);state.feedback='';state.feedbackKind='';render();listen();}});
document.querySelectorAll('[data-step]').forEach(el=>el.addEventListener('click',()=>{resetActivity(el.dataset.step);if(state.step!=='explore')listen();}));
$('teacherMode').addEventListener('click',()=>{if(state.mode==='teacher')return;stopAudio();state.mode='teacher';render();});
$('childMode').addEventListener('click',()=>{if(state.mode==='child')return;stopAudio();state.mode='child';if(state.step==='sentence')resetActivity('explore');else render();});
$('groupSelect').addEventListener('change',event=>{state.group=event.target.value;resetActivity(state.step==='sentence'?'explore':state.step);});
$('demo').addEventListener('click',listen);$('pause').addEventListener('click',pauseAudio);
$('soundToggle').addEventListener('click',()=>{stopAudio();state.muted=!state.muted;showAudioError(state.muted?'声音已关闭。听音练习需要声音，可点右上角重新开启。':'');syncVoice();});
$('hint').addEventListener('click',()=>{if(state.step==='explore'){state.feedback='跟着声音说一说，不用着急。';state.feedbackKind='';render();listen();}else if(state.step==='sentence'){state.feedback='一个用 There’s，两个用 There are。';state.feedbackKind='';render();listen();}else if(!state.answered){state.hinted=true;state.feedback='看看轻轻亮起来的水果，再听一听。';state.feedbackKind='';render();listen();}});
$('praise').addEventListener('click',()=>{state.feedback='愿意开口，真棒！';state.feedbackKind='success';render();speak('great');});
function move(delta){stopAudio();state.feedback='';state.feedbackKind='';if(state.step==='explore')state.index=Math.max(0,Math.min(getList().length-1,state.index+delta));else if(state.step==='sentence')state.quantity=Math.max(1,Math.min(2,state.quantity+delta));render();}
$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));
$('sentence').addEventListener('click',()=>resetActivity(state.step==='sentence'?'explore':'sentence'));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&voice.active&&!voice.paused)pauseAudio();});
render();
</script>
</body>
</html>
